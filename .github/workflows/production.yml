name: Platform production
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_frontend_build:
        description: Rebuild and publish the frontend even without input changes
        type: boolean
        default: false
concurrency:
  group: platform-production
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    env:
      DEPLOY_ENV: production
      RELEASE_SHA: ${{ github.sha }}
      PUBLIC_SITE_ORIGIN: ${{ vars.PUBLIC_SITE_ORIGIN }}
      PUBLIC_API_ORIGIN: ${{ vars.PUBLIC_API_ORIGIN }}
      VITE_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail closed on missing target inputs
        env:
          WG_CLIENT_PRIVATE_KEY: ${{ secrets.WG_CLIENT_PRIVATE_KEY }}
          WG_SERVER_PUBLIC_KEY: ${{ secrets.WG_SERVER_PUBLIC_KEY }}
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          WG_SERVER_ADDRESS: ${{ secrets.WG_SERVER_ADDRESS }}
          WG_CLIENT_ADDRESS: ${{ secrets.WG_CLIENT_ADDRESS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          python3 platform/deployment/check-ci-inputs.py
          python3 platform/deployment/record-production.py --preflight
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate contracts
        run: |
          python3 platform/deployment/release.py check
          python3 -m unittest discover -s platform/deployment/tests -p 'test_*.py'
          node --test platform/deployment/tests/*.test.mjs
          python3 tools/py/run_compose_supabase.py --check-only
      - name: Select frontend publication
        id: frontend
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          FORCE_FRONTEND_BUILD: ${{ inputs.force_frontend_build || false }}
        run: python3 platform/deployment/record-production.py --select
      - name: Install frontends
        if: steps.frontend.outputs.build == 'true'
        run: |
          python3 platform/deployment/install-frontends.py
      - name: Build isolated production static artifact
        if: steps.frontend.outputs.build == 'true'
        run: node platform/deployment/build-release.mjs
      - name: Browser acceptance
        if: steps.frontend.outputs.build == 'true'
        run: |
          npm exec --workspace=apps/scribeswell/web -- playwright install --with-deps chromium
          apps/pts/web/node_modules/.bin/playwright install --with-deps chromium
          npm run test:browser --workspace=apps/scribeswell/web
          npm run test:browser --prefix apps/pts/web
          npm exec --workspace=apps/scribeswell/web -- playwright test --config playwright.session.config.cjs
          npx --prefix apps/scribeswell/web playwright test --config apps/scribeswell/web/playwright.release.config.cjs
      - name: Gateway acceptance
        run: python3 platform/deployment/tests/gateway_smoke.py
      - name: Registry authentication
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable silo images
        run: python3 platform/deployment/ci-build.py --sha "$RELEASE_SHA" --repository "${GITHUB_REPOSITORY,,}" --output images.json --push
      - name: Isolated API container health
        run: python3 platform/deployment/tests/container_smoke.py --images images.json
      - name: Install WireGuard tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
      - name: Connect private deployment tunnel and verify SSH
        env:
          WG_CLIENT_PRIVATE_KEY: ${{ secrets.WG_CLIENT_PRIVATE_KEY }}
          WG_SERVER_PUBLIC_KEY: ${{ secrets.WG_SERVER_PUBLIC_KEY }}
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          WG_SERVER_ADDRESS: ${{ secrets.WG_SERVER_ADDRESS }}
          WG_CLIENT_ADDRESS: ${{ secrets.WG_CLIENT_ADDRESS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: sudo --preserve-env=WG_CLIENT_PRIVATE_KEY,WG_SERVER_PUBLIC_KEY,WG_ENDPOINT,WG_SERVER_ADDRESS,WG_CLIENT_ADDRESS,DEPLOY_HOST,DEPLOY_USER,SSH_PRIVATE_KEY,SSH_KNOWN_HOSTS python3 platform/deployment/wireguard/runner.py setup
      - name: Migrate and activate production APIs
        env:
          REGISTRY_ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WG_CLIENT_PRIVATE_KEY: ${{ secrets.WG_CLIENT_PRIVATE_KEY }}
          WG_SERVER_PUBLIC_KEY: ${{ secrets.WG_SERVER_PUBLIC_KEY }}
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          WG_SERVER_ADDRESS: ${{ secrets.WG_SERVER_ADDRESS }}
          WG_CLIENT_ADDRESS: ${{ secrets.WG_CLIENT_ADDRESS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash platform/deployment/ci-deploy.sh
      - name: Remove private deployment tunnel and runner secrets
        if: always()
        run: sudo python3 platform/deployment/wireguard/runner.py teardown
      - name: Publish and verify production frontend
        if: steps.frontend.outputs.build == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" && test -n "$NETLIFY_SITE_ID"
          python3 platform/deployment/publish-frontend.py
          python3 platform/deployment/record-production.py
      - name: Verify retained frontend and production API
        if: steps.frontend.outputs.build == 'false'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: python3 platform/deployment/record-production.py --retained
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            images.json
            production.json
            frontend-plan.json
            netlify-deploy.json
            netlify.toml
            platform/deployment/public-release/
          retention-days: 30
