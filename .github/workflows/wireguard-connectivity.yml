name: Production WireGuard connectivity
on:
  workflow_dispatch:
concurrency:
  group: platform-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  connectivity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install WireGuard tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools
      - name: Validate private inputs and verify SSH without deployment
        env:
          WG_CLIENT_PRIVATE_KEY: ${{ secrets.WG_CLIENT_PRIVATE_KEY }}
          WG_SERVER_PUBLIC_KEY: ${{ secrets.WG_SERVER_PUBLIC_KEY }}
          WG_ENDPOINT: ${{ secrets.WG_ENDPOINT }}
          WG_SERVER_ADDRESS: ${{ secrets.WG_SERVER_ADDRESS }}
          WG_CLIENT_ADDRESS: ${{ secrets.WG_CLIENT_ADDRESS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          python3 platform/deployment/wireguard/runner.py validate
          sudo --preserve-env=WG_CLIENT_PRIVATE_KEY,WG_SERVER_PUBLIC_KEY,WG_ENDPOINT,WG_SERVER_ADDRESS,WG_CLIENT_ADDRESS,DEPLOY_HOST,DEPLOY_USER,SSH_PRIVATE_KEY,SSH_KNOWN_HOSTS python3 platform/deployment/wireguard/runner.py setup
      - name: Remove private tunnel and runner secrets
        if: always()
        run: sudo python3 platform/deployment/wireguard/runner.py teardown
