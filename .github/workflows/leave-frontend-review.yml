name: Leave frontend review build
on:
  push:
    branches: [leave/e1-a1-frontend-source-20261106]
permissions:
  contents: read
concurrency:
  group: leave-frontend-review
  cancel-in-progress: false
jobs:
  frontend:
    if: github.ref == 'refs/heads/leave/e1-a1-frontend-source-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLICATION: leave
      RELEASE_PROFILE: leave-pilot
      DEPLOY_ENV: production
      PUBLIC_SITE_ORIGIN: https://leave.machon.io
      PUBLIC_API_ORIGIN: https://api.scribeswell.com
      VITE_LEAVE_AUTH_URL: https://gjbsnxmbhxsvcblzgfts.supabase.co
      # Public publishable key already present in the browser artifact.
      VITE_LEAVE_AUTH_ANON_KEY: sb_publishable_WLx4ToiSSvpz5wfF-sQlXQ_OedNmyJA
      VITE_LEAVE_DIRECTORY_ORIGIN: https://api.scribeswell.com/directory
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out the immutable review revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, pinned from official repository
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Select Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7, pinned from official repository
        with:
          node-version: 26.11.1
          package-manager-cache: false
      - name: Select npm
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@12.2.0
          test "$(node --version)" = v26.11.1
          test "$(npm --version)" = 12.2.0
      - name: Install only Leave and its workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --workspace=apps/leave/web --include-workspace-root=false
      - name: Type-check Leave
        run: npm run type-check --workspace=apps/leave/web
      - name: Build the independent Leave artifact
        run: node platform/deployment/build-release.mjs
      - name: Verify source and actual run binding
        run: |
          git diff --exit-code
          python3 - <<'PYCODE'
          import json, os, pathlib, re
          identity=json.loads(pathlib.Path('platform/deployment/public-release-leave/release-identity.json').read_text())
          source=os.environ['GITHUB_SHA']
          run=os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          if not re.fullmatch('[0-9a-f]{40}',source) or not re.fullmatch('[0-9]+-[0-9]+',run):
              raise SystemExit('invalid_runner_identity')
          if identity['sha']!=source or identity['release_attempt']!=run or identity['publication']!='leave':
              raise SystemExit('frontend_identity_mismatch')
          print(json.dumps({k:identity[k] for k in ['sha','release_attempt','publication','public_build_fingerprint']}))
          PYCODE
      - name: Retain the frontend candidate on GitHub
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, pinned from official repository
        with:
          name: leave-frontend-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform/deployment/public-release-leave
          if-no-files-found: error
          retention-days: 30
