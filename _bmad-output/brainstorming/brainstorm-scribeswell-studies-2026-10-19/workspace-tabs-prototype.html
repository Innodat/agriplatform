rgin:7px 0}.save{font-size:11px;color:#7b795f}.save.failed{color:#a34f32}.refrow{padding:9px 0;border-bottom:1px solid #eee8dc}.refrow>button{padding:3px 0;font-weight:500;text-align:left;display:block}.refactions{display:flex;gap:8px;margin-top:2px}.refactions button{font-size:11px;color:#8c6626;padding:5px 0}.refactions button:hover{background:transparent;text-decoration:underline}.rail{width:62px;flex-shrink:0;background:#f3efe5;border-left:1px solid #e5dfd2;display:flex;flex-direction:column;gap:9px;padding:16px 3px}.rail button{padding:9px 2px;font-size:10px;color:#827156}.rail button span{display:block;font-size:21px;margin-bottom:5px}.rail .chosen{background:#e9dfc8;color:#72521e}.mobiletools,.passageswitch{display:none}summary{list-style:none}details{position:relative}details[open]>button{position:absolute;right:0;z-index:3;background:#fffefa;border:1px solid #e5dfd2;white-space:nowrap;box-shadow:0 4px 20px #423e3522}footer{height:34px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:#938773;border-top:1px solid #e5dfd2;padding:4px 8px}dialog{border:1px solid #d8cbb0;border-radius:12px;padding:24px;max-width:min(450px,calc(100vw - 30px));background:#fffefa;box-shadow:0 15px 80px #423e3533}dialog::backdrop{background:#423e3544}dialog h2{font:23px Georgia;margin:0 0 12px}dialog p{line-height:1.6}.choices{display:flex;flex-wrap:wrap;gap:7px}.choices button{background:#f2e7cb}.dialogcancel{margin-top:15px}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%)}

<header><span class="brand">Scribeswell</span><span class="tag">Workspace exploration</span></header>
<main><section class="reading" aria-label="Reading workspace"><div class="workspacebar"><div class="tabs" role="tablist" aria-label="Reading workspaces"></div><button class="addtab" aria-label="New workspace tab" title="New workspace tab">+</button><button class="workspacemenu" aria-label="Workspace menu" title="Workspace menu">⋯</button></div><div class="readingbar"><span>Study</span><strong>Kissing the Son</strong><button class="addpane" aria-label="Add reader pane" title="Add reader pane">+</button></div><div class="passageswitch" aria-label="Passages in this workspace"></div><div class="panes"></div></section><aside class="tool" aria-label="Study and analysis tools"></aside><nav class="rail" aria-label="Tools"><button data-tool="Studies"><span>▤</span>Studies</button><button data-tool="Analysis"><span>א</span>Analysis</button></nav></main>
<nav class="mobiletools" aria-label="Mobile views"><button data-mobile="Reader">Reader</button><button data-mobile="Studies">Studies</button><button data-mobile="Analysis">Analysis</button></nav><footer>Interactive mockup · local only · resets on reload</footer><div class="sr" role="status" id="announce"></div><dialog id="chooser"></dialog>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const refs=['Daniel 7:13','Psalm 110:1','Psalm 2:11','Matthew 26:63–64','Psalm 119:1','Psalm 119:176'];
const scripture={
'Daniel 7:13':[['13','חָזֵה הֲוֵית בְּחֶזְוֵי לֵילְיָא וַאֲרוּ עִם־עֲנָנֵי שְׁמַיָּא <mark>כְּבַר אֱנָשׁ</mark> אָתֵה הֲוָה וְעַד־עַתִּיק יוֹמַיָּא מְטָה וּקְדָמוֹהִי הַקְרְבוּהִי׃']],
'Psalm 110:1':[['1','לְדָוִד מִזְמוֹר נְאֻם יְהוָה לַאדֹנִי <mark class="blue">שֵׁב לִימִינִי</mark> עַד־אָשִׁית אֹיְבֶיךָ הֲדֹם לְרַגְלֶיךָ׃']],
'Psalm 2:11':[['11','עִבְדוּ אֶת־יְהוָה בְּיִרְאָה וְגִילוּ בִּרְעָדָה׃']],
'Psalm 119:1':[['1','אַשְׁרֵי תְמִימֵי־דָרֶךְ הַהֹלְכִים בְּתוֹרַת יְהוָה׃']],
'Psalm 119:176':[['176','תָּעִיתִי כְּשֶׂה אֹבֵד בַּקֵּשׁ עַבְדֶּךָ כִּי מִצְוֹתֶיךָ לֹא שָׁכָחְתִּי׃']]};
let serial=0;const pane=ref=>({id:'p'+(++serial),ref,scroll:0});
const workspace=(title,rs)=>{const panes=rs.map(pane);return{id:'t'+(++serial),title,panes,active:panes[0].id,tool:'Studies',note:'n1',study:'Kissing the Son'}};
let tabs=[workspace('Kissing the Son',refs.slice(0,3)),workspace(null,[refs[4],refs[5]])],active=tabs[0].id,visibleTool='Studies',mobile='Reader';
const notes={n1:{text:'Follow the lecture’s connection between Daniel 7:13 and Psalm 110:1. Revisit the phrase בר אנש and compare how these passages are brought together.',saved:true,fail:false}};
notes.n1.ack=notes.n1.text;let timer;const current=()=>tabs.find(t=>t.id===active),lane=()=>notes[current().note];
function tell(t){$('#announce').textContent=t}
function escape(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}
function capture(){for(const el of $$('.pane')){const p=current().panes.find(p=>p.id===el.dataset.id);if(p)p.scroll=el.querySelector('.passagetext').scrollTop}}
function tabLabel(t){return t.title||(t.panes[0].ref+(t.panes.length>1?" +"+(t.panes.length-1):""))}
function render(){const t=current();$('.tabs').innerHTML=tabs.map(w=>`<div class="tab ${w.id===active?'current':''}"><button role="tab" aria-selected="${w.id===active}" data-tab="${w.id}">${escape(tabLabel(w))}</button>${tabs.length>1?`<button class="close" data-close-tab="${w.id}" aria-label="Close workspace ${escape(tabLabel(w))}">×</button>`:""}</div>`).join('');
$('.readingbar strong').textContent=t.study||'';$('.readingbar strong').hidden=!t.study;$('.readingbar>span').hidden=!t.study;$('.panes').className='panes '+(t.panes.length===4?'four':t.panes.length===3?'three':'');$('.panes').style.setProperty('--cols',t.panes.length);
$('.panes').innerHTML=t.panes.map((p,i)=>`<article class="pane ${p.id===t.active?'active':''}" data-id="${p.id}" aria-label="Pane ${i+1}: ${p.ref}"><div class="panehead"><button class="arrow" aria-label="Previous chapter" title="Chapter navigation not included in this layout mockup" disabled>‹</button><button class="reference" data-pick="${p.id}" title="Choose passage">${p.ref} ▾</button><button class="arrow" aria-label="Next chapter" title="Chapter navigation not included in this layout mockup" disabled>›</button>${t.panes.length>1||tabs.length>1?`<button class="closepane" data-close-pane="${p.id}" aria-label="Close pane ${i+1}">×</button>`:""}</div><div class="passagetext"><p class="anchor">${p.id===t.active?'Active passage · ':''}${p.ref.startsWith('Matthew')?'Reference only':'Illustrative verse excerpt'}</p>${scripture[p.ref]?scripture[p.ref].map(([v,text])=>{if(!t.note)text=text.replace(/<\/?mark[^>]*>/g,'');return `<p class="hebrew" lang="he" dir="rtl"><span class="verse">${v}</span>${text}</p>`}).join(''):'<div class="unavailable">This passage is saved as a reference.<br>The text is not available in this reader.</div>'}<p class="context">${!t.note?'Read freely, or select a study note to show its highlights.':p.ref==='Daniel 7:13'?'Gold marks belong to the selected note. Open another passage beside this one to follow the connection.':p.ref.startsWith('Psalm 119')?'The same chapter can stay open at different verses. Each pane keeps its own place.':p.ref.startsWith('Matthew')?'You can connect this reference to your notes without adding a new Bible text.':'This pane keeps its own place while you explore the other passages.'}</p></div><div class="panefooter">${i+1} of ${t.panes.length} passages · ${p.id===t.active?'Active':'Click to activate'}</div></article>`).join('');
for(const el of $$('.pane')){el.querySelector('.passagetext').scrollTop=t.panes.find(p=>p.id===el.dataset.id).scroll;el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;activatePane(el.dataset.id)});el.addEventListener('focusin',()=>{if(t.active!==el.dataset.id)activatePane(el.dataset.id,false)})}
$('.passageswitch').innerHTML=t.panes.map(p=>`<button data-pane="${p.id}" class="${p.id===t.active?'chosen':''}" aria-pressed="${p.id===t.active}">${p.ref}</button>`).join('');
renderTool();applyViews();bind();}
function applyViews(){$$('.rail button').forEach(b=>b.classList.toggle('chosen',b.dataset.tool===visibleTool));$('.tool').hidden=!visibleTool;$('.reading').classList.toggle('mobilehidden',mobile!=='Reader');$('.tool').classList.toggle('mobileopen',mobile!=='Reader');$$('.mobiletools button').forEach(b=>b.classList.toggle('chosen',b.dataset.mobile===mobile))}
function renderTool(){const t=current(),n=lane(),ref=t.panes.find(p=>p.id===t.active).ref;
if(!t.study){$('.tool').innerHTML='<div class="eyebrow">Studies</div><h1>My studies</h1><p class="small">No study selected in this workspace.</p><button id="sample">Open sample study</button>';$('#sample').onclick=()=>{t.note=null;t.study="Kissing the Son";visibleTool="Studies";render()};return;}
const passages=`<h2>Passages</h2>${refs.slice(0,4).map((r,i)=>`<div class="refrow"><button data-open="${i}">${r}</button><div class="refactions"><button data-beside="${i}">Open beside</button><button data-new="${i}">Open in new tab</button></div></div>`).join('')}`;
if(visibleTool!=='Analysis'){
$('.tool').innerHTML=`<div class="eyebrow">Studies</div><h1>${escape(t.study)}</h1><div class="notebar"><span class="private">My study · Private</span><details><summary aria-label="Study menu" title="Study menu" style="cursor:pointer">⋯</summary><button id="leave">Leave study</button></details></div><h2>Notes <span class="small">1</span></h2><div class="note"><p>${escape(notes.n1.text)}</p><span class="small">Daniel 7:13 · Psalm 110:1</span><br><button id="opennote">Open note →</button></div>${passages}`;
$('#leave').onclick=()=>{$('#leave').closest('details').open=false;leaveStudy()};$('#opennote').onclick=()=>{t.note='n1';visibleTool='Analysis';t.tool='Analysis';if(mobile!=='Reader')mobile='Analysis';render();};return;
}
if(!n){$('.tool').innerHTML='<div class="eyebrow">Analysis</div><h1>Notes</h1><p>No note selected.</p><button id="chooseNote">Open study notes</button>';$('#chooseNote').onclick=()=>{visibleTool='Studies';t.tool='Studies';render()};return;}
$('.tool').innerHTML=`<div class="eyebrow">Analysis · ${escape(t.study)}</div><h1>Word analysis</h1><p class="small">From ${ref}</p><div class="notebar"><strong>Notes</strong><span class="private">My notes</span></div><h2>Current note</h2><div class="small">Daniel 7:13 · Psalm 110:1</div><textarea aria-label="Current note" class="noteedit">${escape(n.text)}</textarea><div class="notebar"><span class="save ${n.saved?'':'failed'}">${n.saved?'Draft saved':'Changes not saved'}</span><button id="retry" ${n.saved?'hidden':''}>Retry</button></div><button class="small" id="failure">${n.fail?'Restore mock saving':'Simulate save failure'}</button>${passages}`;
$('.noteedit').addEventListener('input',e=>{n.text=e.target.value;n.saved=false;updateSave();clearTimeout(timer);if(!n.fail)timer=setTimeout(()=>{n.saved=true;n.ack=n.text;updateSave()},500)});
$('#failure').onclick=()=>{n.fail=!n.fail;clearTimeout(timer);$('#failure').textContent=n.fail?'Restore mock saving':'Simulate save failure';if(!n.fail){n.saved=true;n.ack=n.text;updateSave()}};$('#retry').onclick=()=>{if(!n.fail){n.saved=true;n.ack=n.text}updateSave()};}
function updateSave(){if(!$('.save'))return;const n=lane();$('.save').textContent=n.saved?'Draft saved':'Changes not saved';$('.save').classList.toggle('failed',!n.saved);$('#retry').hidden=n.saved}
function activatePane(id,redraw=true){capture();current().active=id;if(redraw)render();else{$$('.pane').forEach(el=>el.classList.toggle('active',el.dataset.id===id));$$('.panefooter').forEach((el,i)=>el.textContent=(i+1)+' of '+current().panes.length+' passages · '+(current().panes[i].id===id?'Active':'Click to activate'));renderTool();applyViews();bind();tell('Active passage '+current().panes.find(p=>p.id===id).ref)}}
function addTab(ref,source=current()){if(tabs.length>=12){dialog('Workspace limit','Close a tab before opening another.',[]);return}capture();const t=workspace(null,[ref||source.panes.find(p=>p.id===source.active).ref]);t.note=source.note;t.study=source.study;t.tool=source.tool;tabs.push(t);active=t.id;visibleTool=t.tool;render();tell('New workspace opened');if(!ref)pick('here',t.active);}
function openRef(ref,mode){capture();const t=current();if(mode==='new'){addTab(ref);return}if(mode==='beside'&&t.panes.length===4){dialog('Four passages are open','Choose a pane to replace, or open this passage in a new tab.',[...t.panes.map((p,i)=>['Replace '+(i+1)+': '+p.ref,()=>{p.ref=ref;p.scroll=0;t.active=p.id;render()}]),['Open in new tab',()=>addTab(ref)]]);return}if(mode==='beside'){const p=pane(ref),at=t.panes.findIndex(p=>p.id===t.active);t.panes.splice(at+1,0,p);t.active=p.id}else{const p=t.panes.find(p=>p.id===t.active);p.ref=ref;p.scroll=0}mobile='Reader';render();tell('Opened '+ref)}
function dialog(title,message,choices){const d=$('#chooser');d.innerHTML=`<h2>${title}</h2><p>${message}</p><div class="choices"></div><button class="dialogcancel">Cancel</button>`;for(const [label,fn]of choices){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{d.close();fn()};d.querySelector('.choices').append(b)}d.querySelector('.dialogcancel').onclick=()=>d.close();d.showModal()}
function pick(mode,id){dialog('Choose a passage','Reference typing will use the reader’s existing picker. This mockup focuses on workspace layout.',refs.map(r=>[r,()=>{if(id)current().active=id;openRef(r,mode)}]))}
function depart(t,action,kind='Close'){const n=notes[t.note];if(n&&!n.saved&&!tabs.some(w=>w.id!==t.id&&w.note===t.note)){if(!n.fail){n.saved=true;n.ack=n.text;action();return}const text=n.text;dialog('Changes not saved','Leaving this last editing context may lose changes that have not been saved.',[['Stay',()=>{}],[kind+' anyway',()=>{if(tabs.includes(t)&&notes[t.note]===n&&n.text===text){n.text=n.ack;n.saved=true;action()}}]]);return}action()}
function closeTab(id){if(tabs.length<=1)return;capture();const t=tabs.find(t=>t.id===id);if(!t)return;depart(t,()=>{const index=tabs.indexOf(t);tabs.splice(index,1);if(active===id)active=tabs[Math.min(index,tabs.length-1)].id;visibleTool=current().tool;render();tell('Workspace closed; saved study content kept')})}
function leaveStudy(){capture();const t=current();depart(t,()=>{t.study=null;t.note=null;t.tool='Studies';visibleTool='Studies';if(mobile!=='Reader')mobile='Studies';render();tell('Study left; passages retained')},'Switch')}
function addReaderPane(){const t=current();if(t.panes.length>=4){dialog('Four passages are open','Choose a pane whose passage you want to change, or open a new tab.',[...t.panes.map((p,i)=>['Choose passage in pane '+(i+1),()=>{t.active=p.id;render();pick('here',p.id)}]),['Open in new tab',()=>addTab()]]);return}const ref=t.panes.find(p=>p.id===t.active).ref;openRef(ref,'beside');pick('here',t.active)}
function workspaceMenu(){dialog('Workspace','Manage this reading tab.',[['Rename tab',()=>{dialog('Rename tab','This changes the tab label only.',[['Rename',()=>{const value=$('#tabname').value.trim();current().title=value||null;render()}]]);const input=document.createElement('input');input.id='tabname';input.setAttribute('aria-label','Tab name');input.value=tabLabel(current());$('#chooser .choices').before(input);input.focus();input.select()}]])}
function bind(){$$('[data-tab]').forEach(b=>{b.onclick=()=>{capture();current().tool=visibleTool||current().tool;active=b.dataset.tab;visibleTool=current().tool;render()};b.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const i=tabs.findIndex(t=>t.id===active),j=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;capture();active=tabs[j].id;visibleTool=current().tool;render();$(`[data-tab="${active}"]`).focus()}});$$('[data-close-tab]').forEach(b=>b.onclick=()=>closeTab(b.dataset.closeTab));$$('[data-close-pane]').forEach(b=>b.onclick=()=>{capture();const t=current();if(t.panes.length<=1){closeTab(t.id);return}const i=t.panes.findIndex(p=>p.id===b.dataset.closePane);t.panes.splice(i,1);if(!t.panes.some(p=>p.id===t.active))t.active=t.panes[Math.min(i,t.panes.length-1)].id;render()});$$('[data-pick]').forEach(b=>b.onclick=()=>pick('here',b.dataset.pick));$$('[data-pane]').forEach(b=>b.onclick=()=>activatePane(b.dataset.pane));$$('[data-open]').forEach(b=>b.onclick=()=>openRef(refs[+b.dataset.open],'here'));$$('[data-beside]').forEach(b=>b.onclick=()=>openRef(refs[+b.dataset.beside],'beside'));$$('[data-new]').forEach(b=>b.onclick=()=>openRef(refs[+b.dataset.new],'new'))}
$('.addtab').onclick=()=>addTab();$('.addpane').onclick=()=>addReaderPane();$('.workspacemenu').onclick=()=>workspaceMenu();$$('[data-tool]').forEach(b=>b.onclick=()=>{capture();visibleTool=visibleTool===b.dataset.tool?null:b.dataset.tool;if(visibleTool)current().tool=visibleTool;renderTool();applyViews();bind()});$$('[data-mobile]').forEach(b=>b.onclick=()=>{capture();mobile=b.dataset.mobile;if(mobile!=='Reader'){visibleTool=mobile;current().tool=mobile;renderTool();bind()}applyViews()});render();
</script></html>
