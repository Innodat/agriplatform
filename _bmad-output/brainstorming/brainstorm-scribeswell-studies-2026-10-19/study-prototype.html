function parseReference(raw){const m=raw.trim().match(/^([^\s\d:]+)\s+([^\s:]+)(?:\s*:\s*([^\s\-–]+)(?:\s*[-–]\s*([^\s]+))?)?$/u);if(!m)return{error:'Enter a book and chapter; verses are optional.'};const alias=m[1].toLowerCase().replace(/[׳״'".]/g,'');const b=books.find(b=>b.aliases.includes(alias));if(!b)return{error:'This prototype recognises Psalms, Daniel and Matthew.'};const chapter=numberFrom(m[2]),start=m[3]?numberFrom(m[3]):null,end=m[4]?numberFrom(m[4]):start;if(!Number.isInteger(chapter)||chapter<1||chapter>b.chapters)return{book:b,error:'Check the chapter number.'};if(start!==null&&(!Number.isInteger(start)||!Number.isInteger(end)||start<1||end<start))return{book:b,error:'Check the verse range.'};const max=corpus.counts[`${b.id}.${chapter}`]||(b.id==='Matt'&&chapter===26?75:null);if(max&&end>max)return{book:b,error:'This chapter has '+max+' verses.'};return{book:b,ref:R(b.id,chapter,start,end)}}
function openPicker(mode,anchor,ref=panes[activePane].ref,pane=activePane){if(mode==='insert'){const s=window.getSelection();if(s.rangeCount&&$('#editor')?.contains(s.anchorNode))pendingAction=s.getRangeAt(0).cloneRange()}hidePopups();pickerState={mode,pane,book:ref.book,anchor};$('#reference-input').value=label(ref);$('#picker-foot').textContent=mode==='navigate'?'Enter or click chapter to open':mode==='add'?'Enter or click chapter to add · reader stays in place':'Insert a reference link · does not add to the passage list';renderPicker();const r=anchor.getBoundingClientRect();position($('#picker'),r.left,r.bottom+7);$('#reference-input').focus();$('#reference-input').select()}
function renderPicker(){const raw=$('#reference-input').value,parsed=parseReference(raw);if(parsed.book)pickerState.book=parsed.book.id;else{const alias=raw.toLowerCase().trim().replace(/[׳״'".]/g,'');const found=books.find(b=>b.aliases.some(a=>a===alias));if(found)pickerState.book=found.id}$('#picker-books').replaceChildren();for(const b of books){const el=button(b.en,()=>{pickerState.book=b.id;$('#reference-input').value=b.en;renderPicker()},'picker-book'+(b.id===pickerState.book?' active':''));const he=document.createElement('span');he.lang='he';he.textContent=b.he;el.append(he);$('#picker-books').append(el)}const b=bookBy(pickerState.book);$('#picker-bookname').textContent=b.en;$('#chapters').replaceChildren();for(let c=1;c<=b.chapters;c++){const selected=parsed.ref&&parsed.ref.book===b.id&&parsed.ref.chapter===c;const chapter=button(hebrewNumber(c),()=>confirmPicker(selected?parsed.ref:R(b.id,c)),'chapter'+(selected?' active':''));chapter.setAttribute('aria-label','Chapter '+c+' of '+b.en+(selected&&parsed.ref.start?' · verses '+parsed.ref.start+(parsed.ref.end!==parsed.ref.start?'–'+parsed.ref.end:''):''));if(selected&&parsed.ref.start){const range=document.createElement('small');range.dir='ltr';range.textContent=':'+parsed.ref.start+(parsed.ref.end!==parsed.ref.start?'–'+parsed.ref.end:'');chapter.append(range)}$('#chapters').append(chapter)}const error=parsed.error&&raw.includes(':');$('#picker-error').hidden=!error;$('#picker-error').textContent=error?parsed.error:'';requestAnimationFrame(()=>{const active=$('#chapters .active');if(active)active.scrollIntoView({block:'nearest'})})}
function closePicker(){$('#picker').hidden=true;const anchor=pickerState?.anchor;pickerState=null;if(anchor?.isConnected)anchor.focus()}
function confirmPicker(ref){const state=pickerState;if(!state)return;closePicker();if(state.mode==='navigate')navigate(ref,state.pane);else if(state.mode==='add'){if(study().owner!=='me'){toast('Add passages to your own copy of this study.');return}if(!study().passages.some(r=>refKey(r)===refKey(ref))){study().passages.push(structuredClone(ref));renderStudy();toast(label(ref)+' added. Reader stays in place.')}else toast('That passage is already in this study.')}else if(state.mode==='insert'){const editor=$('#editor');if(!editor)return;editor.focus();const a=document.createElement('a');a.dataset.ref=JSON.stringify(ref);a.href='#';a.textContent=label(ref);const s=window.getSelection();if(pendingAction&&editor.contains(pendingAction.commonAncestorContainer)){s.removeAllRanges();s.addRange(pendingAction);pendingAction.deleteContents();pendingAction.insertNode(a);pendingAction.setStartAfter(a);pendingAction.collapse(true);s.removeAllRanges();s.addRange(pendingAction)}else editor.append(a);saveEditor(note(editing));pendingAction=null}}
function insertExternalLink(){const editor=$('#editor');if(!editor)return;const s=window.getSelection(),range=s.rangeCount?s.getRangeAt(0).cloneRange():null;showModal('Add source link',body=>{const input=document.createElement('input');input.type='url';input.placeholder='https://…';input.setAttribute('aria-label','Source link URL');body.append(input);modalActions(body,[['Cancel',closeModal],['Insert link',()=>{if(!/^https?:\/\//i.test(input.value)){input.setCustomValidity('Use an http or https link.');input.reportValidity();return}const a=document.createElement('a');a.href=input.value;a.target='_blank';a.rel='noopener noreferrer';a.textContent=range&&!range.collapsed?range.toString():input.value;closeModal();if(range&&editor.contains(range.commonAncestorContainer)){range.deleteContents();range.insertNode(a)}else editor.append(a);saveEditor(note(editing))},true]])})}
function wordItems(pane){return $$(`.pane[data-pane="${pane}"] .word`).map(el=>({verse:Number(el.dataset.verse),index:Number(el.dataset.index),text:el.textContent,el}))}
function selectOne(pane,verse,index){const p=panes[pane];const item=wordItems(pane).find(i=>i.verse===verse&&i.index===index);selection={pane,ref:R(p.ref.book,p.ref.chapter,verse),items:[{verse,index,text:item.text}]};shiftAnchor={pane,verse,index};paintMarks()}
function inspectWord(pane,verse,index){selectOne(pane,verse,index);inspected=structuredClone(selection);activePane=pane;const n=note(),marked=n?.marks.some(m=>m.book===selection.ref.book&&m.chapter===selection.ref.chapter&&m.verse===verse&&m.words.includes(index));displayedNote=marked?n.id:displayedNote;renderAnalysis();setTab(marked?'notes':'word');setTool('analysis',true)}
function captureNativeSelection(){const s=window.getSelection();if(!s||s.isCollapsed||$('#editor')?.contains(s.anchorNode))return false;const start=(s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement)?.closest('.pane'),end=(s.focusNode.nodeType===1?s.focusNode:s.focusNode.parentElement)?.closest('.pane');if(!start||start!==end)return false;const pane=Number(start.dataset.pane),range=s.getRangeAt(0),items=wordItems(pane).filter(item=>range.intersectsNode(item.el)).map(({el,...item})=>item);if(!items.length)return false;const p=panes[pane];selection={pane,ref:R(p.ref.book,p.ref.chapter,Math.min(...items.map(i=>i.verse)),Math.max(...items.map(i=>i.verse))),items};shiftAnchor={pane,...items[0]};activePane=pane;paintMarks();showSelectionActions();return true}
function showSelectionActions(){if(!selection)return;$('#context-menu').hidden=true;$('#palette').hidden=true;const item=selection.items[0];const anchor=$(`.pane[data-pane="${selection.pane}"] .word[data-verse="${item.verse}"][data-index="${item.index}"]`);if(!anchor)return;const r=anchor.getBoundingClientRect();position($('#selection-actions'),r.left-60,r.top-52)}
function showContext(x,y){if(!selection)return;hidePopups();const menu=$('#context-menu');menu.replaceChildren();const head=document.createElement('div');head.textContent='Selected text';menu.append(head);for(const [text,action]of [['Highlight ›','highlight'],['Add note','note'],['Add to study','study']]){const b=button(text,()=>selectionAction(action,b));b.setAttribute('role','menuitem');menu.append(b)}position(menu,x,y)}
function selectionAction(action,anchor){if(!selection)return;const sel=structuredClone(selection);requireLogin(()=>{if(action==='highlight'){if(!note()||note().owner!=='me'){chooseNote(()=>showPalette(anchor));return}showPalette(anchor)}else if(action==='note'){hidePopups();createNote(selectionRefs(sel),sel)}else{hidePopups();const refs=selectionRefs(sel);const r=R(sel.ref.book,sel.ref.chapter,refs[0].start,refs.at(-1).end);if(study()?.owner!=='me'){chooseOwnStudy(id=>{activeStudy=id;addSelectedPassage(r)});return}addSelectedPassage(r)}})}
function addSelectedPassage(ref){const s=study();if(!s.passages.some(r=>refKey(r)===refKey(ref))){s.passages.push(ref);renderStudy();toast(label(ref)+' added to '+s.title)}else toast(label(ref)+' is already in '+s.title)}
function showPalette(anchor){const n=note();if(!n||n.owner!=='me')return;const palette=$('#palette');palette.replaceChildren();const head=document.createElement('div');head.className='palette-head';const text=document.createElement('span');text.textContent='For: '+preview(n);head.append(text,button('Change',()=>chooseNote(()=>showPalette(anchor))));palette.append(head);const swatches=document.createElement('div');swatches.className='swatches';for(const [name,colour]of Object.entries(colours)){const b=button('',()=>applyHighlight(colour),'swatch');b.style.background=colour;b.setAttribute('aria-label',name+' highlight');swatches.append(b)}swatches.append(button('Remove',()=>applyHighlight(null),'remove-mark'));palette.append(swatches);const r=anchor?.getBoundingClientRect()||{left:30,top:180};position(palette,r.left,r.top-104)}
function applyHighlight(colour){if(!selection||!note())return;const n=note();for(const verse of new Set(selection.items.map(i=>i.verse))){const indices=selection.items.filter(i=>i.verse===verse).map(i=>i.index);for(const mark of n.marks.filter(m=>m.book===selection.ref.book&&m.chapter===selection.ref.chapter&&m.verse===verse))mark.words=mark.words.filter(i=>!indices.includes(i));n.marks=n.marks.filter(m=>m.words.length);if(colour)n.marks.push({book:selection.ref.book,chapter:selection.ref.chapter,verse,words:indices,colour})}if(colour)addRefs(n,selectionRefs(selection));paintMarks();renderStudy();if(!editing)renderNotes();hidePopups();window.getSelection().removeAllRanges();toast(colour?'Highlight added to your current note.':'Highlight removed. Your note is kept.')}
function startVerseSelection(pane){verseSelection={pane,first:null,last:null};activePane=pane;setTool(null);toast('Choose the first verse number, then the last. One verse is also valid.')}
function chooseVerse(pane,verse){if(!verseSelection||verseSelection.pane!==pane)verseSelection={pane,first:verse,last:verse};else if(verseSelection.first===null)verseSelection.first=verseSelection.last=verse;else verseSelection.last=verse;const first=Math.min(verseSelection.first,verseSelection.last),last=Math.max(verseSelection.first,verseSelection.last);$$(`.pane[data-pane="${pane}"] .verse`).forEach(row=>row.classList.toggle('verse-picked',Number(row.dataset.verse)>=first&&Number(row.dataset.verse)<=last));$('#verse-range-label').textContent=label(R(panes[pane].ref.book,panes[pane].ref.chapter,first,last));$('#verse-actions').hidden=false}
function clearVerseSelection(){verseSelection=null;$('#verse-actions').hidden=true;$$('.verse-picked').forEach(el=>el.classList.remove('verse-picked'))}
$('#panes').addEventListener('mouseup',e=>{if(e.button!==0)return;if(captureNativeSelection())return;const el=e.target.closest('.word');if(!el)return;const pane=Number(el.dataset.pane),verse=Number(el.dataset.verse),index=Number(el.dataset.index);if(e.shiftKey&&shiftAnchor?.pane===pane){const words=wordItems(pane),a=words.findIndex(w=>w.verse===shiftAnchor.verse&&w.index===shiftAnchor.index),b=words.findIndex(w=>w.verse===verse&&w.index===index),items=words.slice(Math.min(a,b),Math.max(a,b)+1).map(({el,...word})=>word);selection={pane,ref:R(panes[pane].ref.book,panes[pane].ref.chapter,Math.min(...items.map(i=>i.verse)),Math.max(...items.map(i=>i.verse))),items};paintMarks();showSelectionActions()}else inspectWord(pane,verse,index)});
$('#panes').addEventListener('pointerdown',e=>{lastPointerType=e.pointerType||'mouse'},{passive:true});
$('#panes').addEventListener('contextmenu',e=>{const el=e.target.closest('.word');if(!el||lastPointerType==='touch')return;e.preventDefault();const pane=Number(el.dataset.pane),verse=Number(el.dataset.verse),index=Number(el.dataset.index);if(!selection||selection.pane!==pane||!selection.items.some(i=>i.verse===verse&&i.index===index))selectOne(pane,verse,index);showContext(e.clientX,e.clientY)});
document.addEventListener('selectionchange',()=>{clearTimeout(selectionTimer);selectionTimer=setTimeout(captureNativeSelection,150)});
$('#selection-actions').onmousedown=e=>e.preventDefault();$('#selection-actions').onclick=e=>{const b=e.target.closest('[data-action]');if(b)selectionAction(b.dataset.action,b)};$('#palette').onmousedown=e=>e.preventDefault();$('#context-menu').onmousedown=e=>e.preventDefault();
$('#reference-input').oninput=renderPicker;$('#reference-input').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const parsed=parseReference(e.target.value);if(parsed.ref)confirmPicker(parsed.ref);else{$('#picker-error').hidden=false;$('#picker-error').textContent=parsed.error}}};$('#picker-close').onclick=closePicker;
$('#compare').onclick=()=>{if(panes.length===2){getScroll();panes=[panes[activePane]];activePane=0;renderReaders()}else compare(panes[activePane].ref)};
$('#studies-tool').onclick=()=>{renderStudy();setTool('studies')};$('#analysis-tool').onclick=()=>{renderAnalysis();setTool('analysis')};$('#reader-tool').onclick=()=>setTool(null);$('#close-dock').onclick=()=>setTool(null);$('#destination').onclick=()=>chooseNote();
$$('[data-tab]').forEach(b=>{b.onclick=()=>{setTab(b.dataset.tab);if(b.dataset.tab==='notes')renderNotes()};b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();setTab(e.key==='Home'?'word':e.key==='End'?'notes':analysisTab==='word'?'notes':'word');$('#'+analysisTab+'-tab').focus()}}});
$('#account').onclick=e=>menuAt(e.currentTarget,'Prototype account',signedIn?[['Sign out of demo',()=>guardSwitch(()=>{signedIn=false;currentNote=displayedNote=null;editing=null;$('#account').textContent='Sign in';setTool(null);renderDestination();paintMarks();renderAnalysis();toast('Public reading remains available.')} )]]:[['Sign in',()=>requireLogin(()=>{renderStudy();setTool('studies',true)})]]);
$('#add-verses').onclick=()=>requireLogin(()=>{const v=verseSelection;if(!v||v.first===null)return;const r=R(panes[v.pane].ref.book,panes[v.pane].ref.chapter,Math.min(v.first,v.last),Math.max(v.first,v.last));if(study()?.owner==='me')addSelectedPassage(r);else chooseOwnStudy(id=>{activeStudy=id;addSelectedPassage(r)});clearVerseSelection()});$('#cancel-verses').onclick=clearVerseSelection;
$('#save-demo').onclick=()=>{failedSaving=!failedSaving;$('#save-demo').textContent=failedSaving?'Restore saving':'Try save failure';toast(failedSaving?'Demo: the next edit will show a save failure.':'Demo: saving restored. Retry your unsaved note.')};
$('#help').onclick=()=>showModal('Try the study flow',body=>{const content=document.createElement('div');content.innerHTML='<p>1. Open the first note in Studies.</p><p>2. Select text in Daniel: drag, Shift-click, or right-click. Add a colour to that note.</p><p>3. Open Psalm 110:1 from the note’s references or compare it from the passage menu.</p><p>4. Add another highlight. Both belong to the same note.</p><p>5. Return to Studies, duplicate the note, or find another study.</p><p>On a phone, long-press uses native selection handles; actions appear at the bottom. Real-device selection testing is still needed.</p><p>This is a local mockup. Saving is simulated, invitations are not sent, and changes reset on reload. Only selected passages have sample text.</p>';body.append(content);modalActions(body,[['Try it',closeModal,true]])});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.selection-actions,.palette,.popup-menu,.picker,.word,.reference-popover'))hidePopups();if(pickerState&&!e.target.closest('.picker,.selector,.formatbar,.section-heading,.new-note'))closePicker()});
document.addEventListener('keydown',e=>{if(!$('#modal-backdrop').hidden){if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const focusable=[...$('#modal').querySelectorAll('button,input,select,[tabindex="0"]')].filter(el=>!el.disabled);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.key==='Escape'){if(pickerState)closePicker();else hidePopups();return}if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.target.closest('input,textarea,[contenteditable]')){e.preventDefault();const target=$(`.pane[data-pane="${activePane}"] .selector`);if(target)openPicker('navigate',target,panes[activePane].ref)}});
renderReaders();renderStudy();renderAnalysis();setTool('studies',true);
if(location.hash==='#private-notes'){studies.find(s=>s.id==='s3').title='Kissing the Son';openNote('n3');}
</script>
