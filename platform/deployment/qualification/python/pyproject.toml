[project]
name = "env-python-baseline-qualification"
version = "0.0.0"
description = "Isolated ENV compatibility fixture; never an application dependency owner"
requires-python = "==3.15.0"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "SQLAlchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "httpx==0.28.1",
    "rfc8785==0.1.4",
    "PyJWT==2.15.1",
]

[dependency-groups]
test = ["pytest==9.1.1"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
